<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= STUDENT DETAILS ================= -->

    <div class="container" id="detailsPage">

        <h1>Online Quiz</h1>

        <p class="subtitle">
            Enter your details to start the quiz
        </p>

        <form id="studentForm">

            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >


            <label for="class">Class</label>

            <input
                type="text"
                id="class"
                placeholder="Enter your class"
                required
            >


            <label for="rollno">Roll No</label>

            <input
                type="text"
                id="rollno"
                placeholder="Enter your roll number"
                required
            >


            <label for="sec">Sec</label>

            <input
                type="text"
                id="sec"
                placeholder="Enter your section"
                required
            >


            <button type="submit">
                Start Quiz
            </button>

        </form>

    </div>


    <!-- ================= QUIZ PAGE ================= -->

    <div class="container quiz-container" id="quizPage">

        <div class="student-info">

            <span id="studentName"></span>

            <span id="studentClass"></span>

            <span id="studentRoll"></span>

            <span id="studentSec"></span>

        </div>


        <h1>Quiz</h1>


        <div id="questionNumber"></div>


        <h2 id="question"></h2>


        <div id="options"></div>


        <button id="nextBtn" type="button">
            Next Question
        </button>

    </div>


    <!-- ================= RESULT PAGE ================= -->

    <div class="container result-container" id="resultPage">

        <h1>Quiz Completed!</h1>

        <h2 id="resultMessage"></h2>

        <p id="score"></p>

        <button
            type="button"
            onclick="location.reload()"
        >
            Take Quiz Again
        </button>

    </div>


    <!-- JavaScript -->
    <script src="style.js"></script>

</body>

</html>
