
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Course Management System</h1>

    <div class="container">

        <h2>Add New Course</h2>

        <form id="courseForm">

            <input
                type="text"
                id="courseName"
                placeholder="Course Name"
                required
            >

            <input
                type="text"
                id="courseCode"
                placeholder="Course Code"
                required
            >

            <input
                type="text"
                id="department"
                placeholder="Department"
                required
            >

            <button type="submit" id="submitBtn">
                Add Course
            </button>

        </form>

        <h2>Available Courses</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Course Name</th>
                    <th>Course Code</th>
                    <th>Department</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="courseList">
            </tbody>

    </table>
    </div>
    <script>
        const form = document.getElementById('courseForm');
        const courseName = document.getElementById('courseName');
        const courseCode = document.getElementById('courseCode');
        const department = document.getElementById('department');
        const submitBtn = document.getElementById('submitBtn');
        let editId = null;
        async function loadCourses() {
            const response = await fetch('/courses');
            const courses = await response.json();
            const list = document.getElementById('courseList');
            list.innerHTML = '';
            courses.forEach(course => {
                const row = document.createElement('tr');
                [course.id, course.courseName,
                 course.courseCode, course.department]
                .forEach(value => {
                    const cell = document.createElement('td');
                    cell.textContent = value;
                    row.appendChild(cell);
                });
                const action = document.createElement('td');
                const editBtn = document.createElement('button');
                editBtn.textContent = 'Edit';
                editBtn.onclick = () => {
                    courseName.value = course.courseName;
                    courseCode.value = course.courseCode;
                    department.value = course.department;
                    editId = course.id;
                    submitBtn.textContent = 'Update Course';
                };
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.onclick = async () => {
                    if (confirm('Are you sure you want to delete this course?')) {
                        const response = await fetch('/courses/' + course.id, {
                            method: 'DELETE'
                        });
                        if (response.ok) {
                            alert('Course deleted successfully!');
                            loadCourses();
                        }
                    }
                };
                action.appendChild(editBtn);
                action.appendChild(deleteBtn);
                row.appendChild(action);
                list.appendChild(row);
            });
        }
        form.addEventListener('submit', async (e) => {

            e.preventDefault();


            const course = {

                courseName: courseName.value,
                courseCode: courseCode.value,
                department: department.value
            };
            let response;
            if (editId === null) {
                response = await fetch('/courses', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify(course)

                });
            } else {
                response = await fetch('/courses/' + editId, {

                    method: 'PUT',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify(course)

                });
            }
            if (response.ok) {

                alert(editId === null
                    ? 'Course added successfully!'
                    : 'Course updated successfully!');

                form.reset();

                editId = null;

                submitBtn.textContent = 'Add Course';

                loadCourses();

            } else {

                alert('Something went wrong!');

            }

        });
        loadCourses();
    </script>

</body>
</html>
